<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClickIt</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header class="brand">
    <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6 4 13 8-6 1-3 6z"/></svg></span>
    <h1>ClickIt</h1>
    <button id="settingsToggle" type="button" aria-label="Settings" title="Settings" aria-controls="settingsPanel" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-1 3-3 1-2 4 2 2v3l4 3 3-1 3 1 4-3v-3l2-2-2-4-3-1-1-3z"/><circle cx="12" cy="11" r="3"/></svg></button>
  </header>
  <section id="hostedPanel" aria-label="AI credits">
    <div class="credit-heading"><strong id="creditBalance">AI included</strong><button id="refreshBalance" type="button">Refresh</button></div>
    <p id="creditNote">10 free suggestions, then $4.99 for 500 credits. No subscription.</p>
    <div id="trialConsent">
      <label class="consent"><input id="adultConsent" type="checkbox">I am 18 or older and use ClickIt for casual quizzes.</label>
      <label class="consent"><input id="dataConsent" type="checkbox">I agree to send this question, or the visible-tab screenshot in Vision, through ClickIt and OpenRouter to the Jev model provider to suggest an answer.</label>
      <button id="startTrial" type="button">Start free trial</button>
    </div>
    <button id="buyCredits" type="button" hidden>Buy 500 credits · $4.99</button>
    <p id="creditError" role="status"></p>
    <p class="account-links"><a id="privacyLink" target="_blank" rel="noreferrer" hidden>Privacy and terms</a> <a id="supportLink" target="_blank" rel="noreferrer">Support</a></p>
  </section>
  <label class="mode-control">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m4 17 5-5 4 4 3-3 5 5"/><circle cx="8" cy="9" r="1"/></svg>
    <select id="mode" aria-label="Read question using" disabled><option value="text">Text</option><option value="vision">Vision · screenshot</option></select>
    <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
  </label>
  <button id="answerNow" class="latest-answer" type="button" aria-label="Answer" aria-describedby="answer" disabled>
    <span class="answer-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6 12 4 4 8-8"/></svg></span>
    <span id="answerLabel">Answer</span>
    <strong id="answer" aria-live="polite">No answer yet</strong>
  </button>
  <section class="status">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></svg>
    <div><p id="status" role="status">Loading…</p><p id="timing"></p><p id="message" role="status"></p></div>
  </section>
  <section id="settingsPanel" hidden>
    <form id="settings">
      <label>AI access<select id="billingMode"><option value="hosted">Included AI · credits</option><option value="byok">Advanced · your API key</option></select></label>
      <div id="byokSettings">
      <label>API provider<select id="provider"><option value="typesafe">TypeSafe</option><option value="openrouter">OpenRouter</option></select></label>
      <label><span id="keyLabel">TypeSafe API key</span><input id="apiKey" type="password" autocomplete="off" placeholder="Paste your API key"></label>
      </div>
      <div class="row"><label>Minimum confidence<input id="minConfidence" type="number" min="0" max="1" step="0.05"></label><label>API deadline, ms<input id="timeoutMs" type="number" min="200" max="15000" step="100"></label></div>
      <div class="prompt-field" id="promptSettings">
        <div class="prompt-heading"><label id="promptLabel" for="textPrompt">Text prompt</label><button id="resetPrompt" type="button">Reset</button></div>
        <textarea id="textPrompt" aria-label="Text prompt" rows="5" maxlength="6000"></textarea>
        <textarea id="visionPrompt" aria-label="Vision prompt" rows="5" maxlength="6000" hidden></textarea>
      </div>
      <button type="submit" id="saveSettings">Save settings</button>
    </form>
    <details id="accessRecovery">
      <summary>Back up or restore credit access</summary>
      <p>This key gives access to your credits. Keep a private copy. Never share it or post it in an issue.</p>
      <label for="hostedAccessKey">Installation access key</label>
      <input id="hostedAccessKey" type="password" autocomplete="off" spellcheck="false" placeholder="ci_…">
      <button id="showAccessKey" type="button">Show key</button>
      <button id="restoreAccess" type="button">Restore access</button>
    </details>
  </section>
  <script src="core.js"></script><script src="config.js"></script><script src="popup.js"></script>
</body></html>
